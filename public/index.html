<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swinglify — Stocks Available for Swing Trades at One Place | Indian Market Live</title>
  <meta name="description" content="Swinglify — Stocks available for swing trades at one place. Real-time Indian stock market data. Track Nifty 50, 100, 200, BankNifty, MidCap, SmallCap and more.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Animated Background -->
  <div class="bg-gradient"></div>
  <div class="bg-grid"></div>

  <!-- Main Container -->
  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
            </svg>
          </div>
          <div class="logo-text">
            <h1>Swinglify</h1>
            <span class="logo-tagline">(Stocks Available for Swing Trades at One Place)</span>
            <span class="logo-subtitle">Indian Market · Live</span>
          </div>
        </div>
      </div>

      <div class="header-center">
        <div class="market-status" id="marketStatus">
          <span class="status-dot"></span>
          <span class="status-text">Loading...</span>
        </div>
      </div>

      <div class="header-right">
        <div class="search-container">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <input type="text" id="searchInput" class="search-input" placeholder="Search stocks... (e.g. RELIANCE, TCS)">
          <div class="search-results" id="searchResults"></div>
        </div>
        <div class="refresh-info">
          <button class="btn-refresh" id="refreshBtn" title="Refresh now">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
          </button>
          <span class="countdown" id="countdown">30s</span>
        </div>
      </div>
    </header>

    <!-- Index Ticker Bar -->
    <div class="ticker-bar" id="tickerBar">
      <div class="ticker-content" id="tickerContent">
        <div class="ticker-placeholder">Loading indices...</div>
      </div>
    </div>

    <!-- Category Navigation -->
    <nav class="category-nav">
      <div class="tab-group">
        <span class="tab-group-label">Broad</span>
        <div class="category-tabs">
          <button class="tab active" data-category="nifty50">Nifty 50</button>
          <button class="tab" data-category="niftynext50">Next 50</button>
          <button class="tab" data-category="nifty100">Nifty 100</button>
          <button class="tab" data-category="nifty200">Nifty 200</button>
          <button class="tab" data-category="nifty500">Nifty 500</button>
        </div>
      </div>
      <div class="tab-group">
        <span class="tab-group-label">Size</span>
        <div class="category-tabs">
          <button class="tab" data-category="midcap50">MidCap 50</button>
          <button class="tab" data-category="midcap100">MidCap 100</button>
          <button class="tab" data-category="midcap150">MidCap 150</button>
          <button class="tab" data-category="smallcap50">SmallCap 50</button>
          <button class="tab" data-category="smallcap100">SmallCap 100</button>
          <button class="tab" data-category="smallcap250">SmallCap 250</button>
          <button class="tab" data-category="microcap250">MicroCap 250</button>
          <button class="tab" data-category="largemidcap250">LargeMidCap 250</button>
          <button class="tab" data-category="midsmall400">MidSmall 400</button>
        </div>
      </div>
      <div class="tab-group">
        <span class="tab-group-label">Sector</span>
        <div class="category-tabs">
          <button class="tab" data-category="banknifty">Bank Nifty</button>
          <button class="tab" data-category="psubank">PSU Bank</button>
          <button class="tab" data-category="privatebank">Pvt Bank</button>
          <button class="tab" data-category="financial">Financial</button>
          <button class="tab" data-category="niftyit">IT</button>
          <button class="tab" data-category="pharma">Pharma</button>
          <button class="tab" data-category="auto">Auto</button>
          <button class="tab" data-category="fmcg">FMCG</button>
          <button class="tab" data-category="metal">Metal</button>
          <button class="tab" data-category="realty">Realty</button>
          <button class="tab" data-category="energy">Energy</button>
          <button class="tab" data-category="infra">Infra</button>
          <button class="tab" data-category="media">Media</button>
          <button class="tab" data-category="healthcare">Healthcare</button>
          <button class="tab" data-category="consumer">Consumer</button>
          <button class="tab" data-category="oilgas">Oil & Gas</button>
          <button class="tab" data-category="pse">PSE</button>
        </div>
      </div>
      <div class="tab-group">
        <span class="tab-group-label">Activity</span>
        <div class="category-tabs">
          <button class="tab" data-category="gainers">🟢 Gainers</button>
          <button class="tab" data-category="losers">🔴 Losers</button>
          <button class="tab" data-category="mostactive">🔥 Most Active</button>
          <button class="tab" data-category="all">All</button>
        </div>
      </div>
    </nav>

    <!-- Sub-Filter Bar -->
    <div class="sub-filter-bar">
      <span class="sub-filter-label">Filter:</span>
      <div class="sub-filter-tabs" id="subFilterTabs">
        <button class="sub-tab active" data-filter="all">📋 All</button>
        <button class="sub-tab" data-filter="mostactive">🔥 Most Active</button>
        <button class="sub-tab" data-filter="topgainers">🟢 Top Gainers</button>
        <button class="sub-tab" data-filter="toplosers">🔴 Top Losers</button>
      </div>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar" id="statsBar">
      <div class="stat-item">
        <span class="stat-label">Stocks</span>
        <span class="stat-value" id="stockCount">—</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Category</span>
        <span class="stat-value" id="categoryName">Nifty 50</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Last Updated</span>
        <span class="stat-value" id="lastUpdated">—</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Avg Change</span>
        <span class="stat-value" id="avgChange">—</span>
      </div>
    </div>

    <!-- Stock Table -->
    <div class="table-container glass-card">
      <div class="table-wrapper">
        <table class="stock-table" id="stockTable">
          <thead>
            <tr>
              <th class="th-rank">#</th>
              <th class="th-symbol sortable" data-sort="symbol">Symbol</th>
              <th class="th-name sortable" data-sort="name">Company</th>
              <th class="th-price sortable" data-sort="price">Price (₹)</th>
              <th class="th-change sortable" data-sort="change">Change %</th>
              <th class="th-change-abs sortable" data-sort="changeAbs">Change (₹)</th>
              <th class="th-volume sortable" data-sort="volume">Volume</th>
              <th class="th-mcap sortable" data-sort="marketCap">Market Cap</th>
              <th class="th-pe sortable" data-sort="pe">P/E</th>
              <th class="th-52w">52W Range</th>
              <th class="th-rec sortable" data-sort="recommendation">Signal</th>
            </tr>
          </thead>
          <tbody id="stockTableBody">
            <!-- Skeleton rows inserted by JS -->
          </tbody>
        </table>
      </div>
    </div>



  </div>

  <!-- Stock Detail Modal -->
  <div class="modal-overlay" id="stockModal">
    <div class="modal glass-card">
      <button class="modal-close" id="modalClose">&times;</button>
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
